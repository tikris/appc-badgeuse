name: Données crèches

# Construit la liste des crèches de Paris (Apur, adresses normalisées par la BAN) et la dépose
# dans l'application : App/BadgeCreche/Resources/creches-paris.json. L'app n'a ensuite besoin
# d'aucun réseau pour proposer les crèches. À relancer de temps en temps (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/fetch_creches.py"
      - "tools/creches-noms.csv"
      - ".github/workflows/creches.yml"

jobs:
  creches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Construction de la liste
        run: python3 tools/fetch_creches.py
      - name: Dépôt sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/BadgeCreche/Resources/creches-paris.json
          git diff --cached --quiet && exit 0
          git commit -m "Liste des crèches de Paris (paris.fr, Apur, OpenStreetMap, BAN ; CI)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
