# Projet XcodeGen (https://github.com/yonaskolb/XcodeGen) utilisé par la CI pour
# compiler l'application complète. Plan B si besoin : `brew install xcodegen && xcodegen`
# génère BadgeCrecheCI.xcodeproj prêt à ouvrir (pensez à régler l'équipe et le bundle ID).
name: BadgeCrecheCI
options:
  bundleIdPrefix: fr.parentsapariscentre
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BadgeCreche:
    type: application
    platform: iOS
    sources:
      - path: App/BadgeCreche
      - path: App/Assets.xcassets
      - path: CI/BadgeCrecheCIApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.parentsapariscentre.badgecreche
        PRODUCT_NAME: BadgeCreche
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Badge Crèche"
        INFOPLIST_KEY_NSCameraUsageDescription: "L'appareil photo sert uniquement à scanner le QR code remis par votre crèche. Aucune image n'est conservée."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: fr
